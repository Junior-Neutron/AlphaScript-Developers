<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | AlphaScript</title><link rel="stylesheet" href="style.css"><script src="supabase-client.js"></script></head>
<body><div class="auth-wrap"><div class="form-card"><a class="brand" href="index.html"><span class="logo">α</span>AlphaScript</a><h1 style="font-size:30px;margin-top:24px">Welcome, developer.</h1><p class="muted">Sign in or create your AlphaScript account.</p><div class="row"><button class="btn primary" id="loginTab">Sign in</button><button class="btn" id="signupTab">Create account</button></div><div id="message" class="message hidden" role="status"></div>
<form id="loginForm"><label>Email</label><input id="loginEmail" type="email" autocomplete="email" required><label>Password</label><input id="loginPassword" type="password" autocomplete="current-password" required><button class="btn primary" type="submit">Sign in</button><div class="auth-links"><a href="#" id="forgotLink">Forgot password?</a><a href="index.html">Back home</a></div></form>
<form id="signupForm" class="hidden"><label>Full name</label><input id="fullName" maxlength="80" required><label>Username</label><input id="username" minlength="3" maxlength="30" pattern="[A-Za-z0-9_]+" required><small>3–30 letters, numbers or underscores.</small><label>Email</label><input id="signupEmail" type="email" autocomplete="email" required><label>Password</label><input id="signupPassword" type="password" minlength="8" autocomplete="new-password" required><label>Confirm password</label><input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required><button class="btn primary" type="submit">Create account</button><div class="auth-links"><a href="index.html">Back home</a></div></form>
<form id="forgotForm" class="hidden"><h2>Reset password</h2><p class="muted">We'll email you a secure reset link.</p><label>Email</label><input id="forgotEmail" type="email" required><button class="btn primary" type="submit">Send reset link</button><div class="auth-links"><a href="#" id="backLogin">Back to sign in</a></div></form></div></div>
<script>
(async()=>{
const db=await window.alphaSupabaseReady;
const $=id=>document.getElementById(id),forms=["loginForm","signupForm","forgotForm"];
function show(which){forms.forEach(id=>$(id).classList.toggle("hidden",id!==which));$("loginTab").classList.toggle("primary",which==="loginForm");$("signupTab").classList.toggle("primary",which==="signupForm");}
function msg(text,type="info"){$("message").textContent=text;$("message").className="message "+type;}
$("loginTab").onclick=()=>show("loginForm");$("signupTab").onclick=()=>show("signupForm");$("forgotLink").onclick=e=>{e.preventDefault();show("forgotForm")};$("backLogin").onclick=e=>{e.preventDefault();show("loginForm")};
$("loginForm").onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;try{const{data,error}=await db.auth.signInWithPassword({email:$("loginEmail").value.trim(),password:$("loginPassword").value});if(error)throw error;if(!data.session)throw Error("Sign-in was not completed.");msg("Signed in. Opening AlphaScript…","success");location.replace("index.html");}catch(err){msg(err.message,"error");}finally{b.disabled=false;}};
$("signupForm").onsubmit=async e=>{e.preventDefault();const b=e.submitter,username=$("username").value.trim(),password=$("signupPassword").value;if(!/^[A-Za-z0-9_]{3,30}$/.test(username)){msg("Username must be 3–30 letters, numbers or underscores.","error");return;}if(password!==$("confirmPassword").value){msg("Passwords do not match.","error");return;}b.disabled=true;try{const{data,error}=await db.auth.signUp({email:$("signupEmail").value.trim(),password,options:{emailRedirectTo:new URL("index.html",location.href).href,data:{full_name:$("fullName").value.trim(),username}}});if(error)throw error;if(data.session){msg("Account created. Opening AlphaScript…","success");location.replace("profile.html");}else{msg("Registration received. Check your email to confirm your account, then sign in.","success");show("loginForm");}}catch(err){msg(err.message,"error");}finally{b.disabled=false;}};
$("forgotForm").onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;try{const{error}=await db.auth.resetPasswordForEmail($("forgotEmail").value.trim(),{redirectTo:new URL("reset-password.html",location.href).href});if(error)throw error;msg("If that account exists, a reset email has been sent. Check your inbox and spam folder.","success");}catch(err){msg(err.message,"error");}finally{b.disabled=false;}};
(async()=>{try{const{data}=await db.auth.getSession();if(data.session)location.replace("index.html");}catch(e){msg(e.message,"error");}})();
})().catch(error=>{const box=document.getElementById("message");if(box){box.textContent=error.message;box.className="message error";}});
</script></body></html>
