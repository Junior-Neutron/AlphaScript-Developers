<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Developer Profile | AlphaScript</title><link rel="stylesheet" href="style.css"><script src="supabase-client.js"></script></head>
<body><header class="top"><a class="brand" href="index.html"><span class="logo">α</span>AlphaScript</a><div class="topright"><a class="btn" href="index.html">Workspace</a><button class="btn danger" id="signOut">Sign out</button></div></header><main class="main"><div class="eyebrow">Developer identity</div><h1 style="font-size:36px">Your profile</h1><p class="muted" id="emailLine">Checking account…</p><div id="status" class="message">Loading profile…</div>
<form id="profileForm" class="card hidden"><div class="profile-grid"><div><h3>Public identity</h3><label>Username</label><input class="field" id="username" required minlength="3" maxlength="30" pattern="[A-Za-z0-9_]+"><label>Full name</label><input class="field" id="fullName" maxlength="80"><label>Country</label><input class="field" id="country" maxlength="80"><label>Occupation</label><input class="field" id="occupation" maxlength="100"><label>Experience level</label><select class="field" id="experience"><option value="">Select level</option><option>Beginner</option><option>Intermediate</option><option>Advanced</option><option>Professional</option></select><label>Website</label><input class="field" id="website" type="url" placeholder="https://example.com"></div><div><h3>About you</h3><label>Bio</label><textarea class="field" id="bio" maxlength="500"></textarea><label>Developer roles (comma-separated)</label><input class="field" id="roles" placeholder="Frontend, Backend, Student"><label>Programming languages (comma-separated)</label><input class="field" id="languages" placeholder="Python, JavaScript, C++"><label>Skills (comma-separated)</label><input class="field" id="skills"><label>Learning goals (comma-separated)</label><input class="field" id="goals"><label class="checkrow"><input type="checkbox" id="isPublic" checked> Make my profile discoverable</label><label class="checkrow"><input type="checkbox" id="showName" checked> Show my full name publicly</label><label class="checkrow"><input type="checkbox" id="showBio" checked> Show my bio publicly</label><button class="btn primary" type="submit">Save profile</button></div></div></form></main>
<script>
(async()=>{
const db=await window.alphaSupabaseReady,$=id=>document.getElementById(id);
let currentUser=null;
function status(t,type="info"){$("status").textContent=t;$("status").className="message "+type;}
function arr(v){return Array.isArray(v)?v.join(", "):"";}
function split(v){return v.split(",").map(x=>x.trim()).filter(Boolean);}
async function load(){try{const{data,error}=await db.auth.getSession();if(error)throw error;currentUser=data.session?.user;if(!currentUser){location.replace("login.html?next=profile.html");return;}$("emailLine").textContent="Signed in as "+currentUser.email;const{data:profile,error:profileError}=await db.from("profiles").select("*").eq("id",currentUser.id).maybeSingle();if(profileError)throw profileError;if(profile){$("username").value=profile.username||currentUser.user_metadata?.username||"";$("fullName").value=profile.full_name||"";$("country").value=profile.country||"";$("occupation").value=profile.occupation||"";$("experience").value=profile.experience_level||"";$("website").value=profile.website||"";$("bio").value=profile.bio||"";$("roles").value=arr(profile.developer_roles);$("languages").value=arr(profile.programming_languages);$("skills").value=arr(profile.skills);$("goals").value=arr(profile.learning_goals);$("isPublic").checked=profile.is_public??true;$("showName").checked=profile.is_full_name_public??true;$("showBio").checked=profile.is_bio_public??true;}else{$("username").value=currentUser.user_metadata?.username||"";$("fullName").value=currentUser.user_metadata?.full_name||"";} $("profileForm").classList.remove("hidden");status("Profile loaded. Save changes when ready.","success");}catch(e){status("Could not load profile: "+e.message,"error");}}
$("profileForm").onsubmit=async e=>{e.preventDefault();const username=$("username").value.trim();if(!/^[A-Za-z0-9_]{3,30}$/.test(username)){status("Username must contain 3–30 letters, numbers or underscores.","error");return;}const website=$("website").value.trim();if(website&&!/^https?:\/\//i.test(website)){status("Website must begin with http:// or https://.","error");return;}const payload={id:currentUser.id,username,full_name:$("fullName").value.trim()||null,country:$("country").value.trim()||null,occupation:$("occupation").value.trim()||null,experience_level:$("experience").value||null,website:website||null,bio:$("bio").value.trim()||null,developer_roles:split($("roles").value),programming_languages:split($("languages").value),skills:split($("skills").value),learning_goals:split($("goals").value),is_public:$("isPublic").checked,is_full_name_public:$("showName").checked,is_bio_public:$("showBio").checked,updated_at:new Date().toISOString()};const b=e.submitter;b.disabled=true;try{const{error}=await db.from("profiles").upsert(payload,{onConflict:"id"});if(error)throw error;status("Profile saved successfully.","success");}catch(err){status("Profile was not saved: "+err.message+". Check the profiles table and its RLS policies in Supabase.","error");}finally{b.disabled=false;}};
$("signOut").onclick=async()=>{const{error}=await db.auth.signOut();if(error)status(error.message,"error");else location.replace("login.html");};
load();
})().catch(error=>{const box=document.getElementById("status");if(box){box.textContent=error.message;box.className="message error";}});
</script></body></html>
