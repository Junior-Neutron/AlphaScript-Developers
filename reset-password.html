<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password | AlphaScript</title><link rel="stylesheet" href="style.css"><script src="supabase-client.js"></script></head>
<body><div class="auth-wrap"><section class="form-card"><a class="brand" href="index.html"><span class="logo">α</span>AlphaScript</a><h1 style="font-size:30px;margin-top:24px">Set a new password</h1><p class="muted" id="description">Verifying your recovery link…</p><div id="status" class="message" role="status">Please wait…</div><form id="resetForm" class="hidden"><label>New password</label><input id="password" type="password" minlength="8" autocomplete="new-password" required><label>Confirm new password</label><input id="confirm" type="password" minlength="8" autocomplete="new-password" required><button class="btn primary" type="submit">Update password</button></form><p class="auth-links"><a href="login.html">Return to login</a><a href="index.html">Home</a></p></section></div>
<script>
(async()=>{
const db=await window.alphaSupabaseReady,$=id=>document.getElementById(id);let ready=false,updated=false;
function status(t,type="info"){$("status").textContent=t;$("status").className="message "+type;}
function formReady(){ready=true;$("resetForm").classList.remove("hidden");$("description").textContent="Choose a new password for your AlphaScript account.";status("Recovery session verified. Enter your new password.","success");}
async function init(){try{const{data,error}=await db.auth.getSession();if(error)throw error;if(data.session){formReady();return;}await new Promise(r=>setTimeout(r,900));const retry=await db.auth.getSession();if(retry.data.session){formReady();return;}throw Error("This reset link is invalid or expired. Return to login and request a new link.");}catch(e){status(e.message,"error");$("description").textContent="We could not verify this recovery link.";} }
db.auth.onAuthStateChange((event,session)=>{if(event==="PASSWORD_RECOVERY"&&session)formReady();});
$("resetForm").onsubmit=async e=>{e.preventDefault();if(!ready||updated)return;const p=$("password").value;if(p.length<8){status("Use at least 8 characters.","error");return;}if(p!==$("confirm").value){status("The passwords do not match.","error");return;}const b=e.submitter;b.disabled=true;try{const{data,error}=await db.auth.updateUser({password:p});if(error)throw error;if(!data.user)throw Error("Password update was not confirmed.");updated=true;$("resetForm").classList.add("hidden");status("Password updated. You can now sign in with your new password.","success");$("description").textContent="Your password has been changed.";await db.auth.signOut();history.replaceState({},document.title,location.pathname);}catch(err){status(err.message,"error");}finally{b.disabled=false;}};
init();
})().catch(error=>{const box=document.getElementById("status");if(box){box.textContent=error.message;box.className="message error";}});
</script></body></html>
